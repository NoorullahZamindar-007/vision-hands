[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handportal"
version = "1.1.0"
description = "A real-time fingertip-controlled visual portal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Noorullah Zamindar"}]
dependencies = [
  "opencv-python>=4.10,<5",
  "mediapipe>=0.10,<0.11",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
handportal = "portal_app:main"

[tool.setuptools]
py-modules = ["portal_app"]

[tool.setuptools.packages.find]
include = ["handportal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
